version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose # HTTP response bodies are closed
    - errorlint # errors are compared and wrapped with errors.Is / %w
    - gosec # common security mistakes
    - noctx # network calls carry a context
    - revive # idiomatic style (naming, doc comments, ...)
  exclusions:
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      # Tests use deliberately fake credentials and fixtures.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/bengisupinar/campaign
