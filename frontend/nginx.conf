# Serves the built SPA and proxies API calls to the api service, so the browser only
# ever talks to one origin (no CORS).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Resolve "api" through Docker's embedded DNS at request time (the variable forces
    # that), so recreating the api container never leaves nginx with a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    location ~ ^/(api/|readyz$) {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Same ID in nginx and API logs: chi's RequestID middleware adopts this header.
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
